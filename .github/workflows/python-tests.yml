name: Python runtime regression
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax and smoke tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
